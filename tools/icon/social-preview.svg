  <g fill="#ffffff" stroke="#5a3d2b" stroke-width="6">
    <rect x="158" y="292" width="50" height="38" rx="10"/>
    <rect x="231" y="292" width="50" height="38" rx="10"/>
    <rect x="304" y="292" width="50" height="38" rx="10" fill="#f4845f"/>
