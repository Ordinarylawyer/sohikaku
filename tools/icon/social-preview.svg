  <text x="329" y="324" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">＋</text>
  <text x="329" y="378" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">＝</text>
